name: Build Morphe Manager

# Manual run only — never on push.
on:
  workflow_dispatch:

# The default GITHUB_TOKEN needs packages:read to fetch
# morphe-patcher from GitHub Packages (see settings.gradle.kts).
permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Morphe's own release workflow installs three JDKs:
      # 17 and 25 are toolchains that build the embedded JVMs,
      # 21 (listed last) is the default that runs Gradle.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # No app/keystore.jks exists in the fork, and -PsignAsDebug is passed,
      # so the release build is signed with the debug key (see
      # app/build.gradle.kts) and the APK is installable as-is.
      #
      # GITHUB_TOKEN is REQUIRED here, not optional: settings.gradle.kts
      # reads morphe-patcher from https://maven.pkg.github.com/MorpheApp/registry
      # with credentials from GITHUB_ACTOR / GITHUB_TOKEN, falling back to
      # "anonymous" with an empty password when unset — and GitHub Packages
      # rejects anonymous reads for public packages (upstream's own
      # build_pull_request.yml says exactly this and passes the token to
      # every Gradle step). Without it the build fails resolving
      # app.morphe:morphe-patcher before compiling anything.
      # This uses the workflow's own automatic token — no personal token,
      # no secret to create, nothing to paste in chat.
      - name: Build release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PsignAsDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: morphe-manager-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
